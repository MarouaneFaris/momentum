<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 60" width="420" height="60" role="img">
  <title>Momentum — full lockup</title>
  <desc>Momentum logo: three stacked parallelogram stripes followed by the wordmark in Inter</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
  <g transform="translate(2, 6) skewX(-12)">
    <rect x="0" y="0"  width="38" height="10" rx="2" fill="#4f46e5" opacity="0.25"/>
    <rect x="0" y="15" width="38" height="10" rx="2" fill="#4f46e5" opacity="0.55"/>
    <rect x="0" y="30" width="38" height="10" rx="2" fill="#4f46e5" opacity="1"/>
  </g>
  <text x="56" y="44" font-size="42" font-weight="600" letter-spacing="-2" fill="#0f0f11">
    <tspan fill="#4f46e5">m</tspan>omentum
  </text>
</svg>
