name: Quality checks

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: lts/Krypton #v24

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddaa #v4.1.0
        with:
          package_json_file: frontend/package.json

      - name: Cache pnpm store
        id: pnpm-store-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Run quality checks
        run: pnpm run check

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: lts/Krypton #v24

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddaa #v4.1.0
        with:
          package_json_file: frontend/package.json

      - name: Cache pnpm store
        id: pnpm-store-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: https://localhost/api

  api:
    name: Api
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Load shared env defaults
        # Exports MARIADB_* from root .env (committed defaults, not secrets)
        # so Symfony resolves DATABASE_URL without fallback values in api/.env.
        run: grep -E '^MARIADB_' ../.env >> $GITHUB_ENV

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc #v2.37.1

      - name: Cache vendor directory
        id: vendor-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: api/vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('api/composer.lock') }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Security audit
        run: composer audit

      - name: Run quality checks
        run: composer check

      - name: Validate Symfony container
        run: php bin/console lint:container --no-debug

      - name: Validate Twig templates
        run: php bin/console lint:twig --no-debug

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync

  test-unit:
    name: Tests / Unit
    runs-on: ubuntu-latest
    needs: api
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    env:
      APP_ENV: test
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc #v2.37.1

      - name: Restore vendor directory
        id: vendor-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: api/vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('api/composer.lock') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run unit tests
        run: php bin/phpunit tests/Unit

  test-integration:
    name: Tests / Integration
    runs-on: ubuntu-latest
    needs: api
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://app:!ChangeMe!@127.0.0.1:3306/app?serverVersion=mariadb-11.8.6&charset=utf8mb4"
      REDIS_URL: "redis://127.0.0.1:6379"
    defaults:
      run:
        working-directory: ./api

    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_test
          MARIADB_PASSWORD: "!ChangeMe!"
          MARIADB_USER: app
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc #v2.37.1
        with:
          extensions: pdo_mysql

      - name: Restore vendor directory
        id: vendor-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: api/vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('api/composer.lock') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run integration tests
        run: php bin/phpunit tests/Integration

  test-functional:
    name: Tests / Functional
    runs-on: ubuntu-latest
    needs: api
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://app:!ChangeMe!@127.0.0.1:3306/app?serverVersion=mariadb-11.8.6&charset=utf8mb4"
      REDIS_URL: "redis://127.0.0.1:6379"
    defaults:
      run:
        working-directory: ./api

    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_test
          MARIADB_PASSWORD: "!ChangeMe!"
          MARIADB_USER: app
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc #v2.37.1
        with:
          extensions: pdo_mysql

      - name: Restore vendor directory
        id: vendor-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: api/vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('api/composer.lock') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run functional tests
        run: php bin/phpunit tests/Functional
