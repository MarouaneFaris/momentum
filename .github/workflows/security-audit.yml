name: Security Audit

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  frontend-audit:
    name: Frontend Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Run audit
        working-directory: frontend
        run: pnpm audit --audit-level=high

  api-audit:
    name: API Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Setup PHP app
        uses: ./.github/actions/setup-php-app

      - name: Run audit
        working-directory: api
        run: composer audit
