version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
          - "@vitejs/*"
          - "vite*"
      typescript-eslint:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "@eslint/*"
      tailwind:
        patterns:
          - "tailwind*"
          - "@tailwindcss/*"
          - "tw-*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/api"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
