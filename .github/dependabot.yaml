version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      # Single group so only one PR touches pnpm-lock.yaml per run.
      # Majors stay ungrouped (individual PRs) so one bad major
      # can't block the whole frontend lockfile update.
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/api"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      # Single group so only one PR touches composer.lock per run.
      # Majors stay ungrouped (individual PRs).
      api:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
