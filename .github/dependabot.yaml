version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
          - "@vitejs/*"
          - "vite*"
      typescript-eslint:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "@eslint/*"
      tailwind:
        patterns:
          - "tailwind*"
          - "@tailwindcss/*"
          - "tw-*"

  - package-ecosystem: "composer"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
