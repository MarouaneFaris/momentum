---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      target: frankenphp_dev
    volumes:
      - ../api:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
      - ./certs:/etc/caddy/certs:ro
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        subscriptions
        demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE}"
      APP_ENV: "${APP_ENV}"
      CADDY_EXTRA_CONFIG: |
        https:// {
          tls /etc/caddy/certs/tls.pem /etc/caddy/certs/tls.key
        }
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
  ###> symfony/mercure-bundle ###
  ###< symfony/mercure-bundle ###

  database:
    volumes:
      - ./mariadb/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    ports:
      - 3306:3306

  redis:
    ports:
      - 6379:6379

  frontend:
    user: "${DOCKER_UID}:${DOCKER_GID}"
    image: node:lts-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../.env
        required: true
      - path: ../.env.local
        required: false
    environment:
      COREPACK_HOME: /app/.corepack
    volumes:
      - ../frontend:/app
      - ./certs:/certs:ro
    command: "sh -c '([ -d node_modules ] || corepack pnpm install --frozen-lockfile) && corepack pnpm run dev'"
    ports:
      - 3000:3000
    depends_on:
      php:
        condition: service_started

volumes: {}
