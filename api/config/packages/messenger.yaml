framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                options:
                    stream: messages
                    group: symfony
                    consumer: "%env(MESSENGER_CONSUMER_ID)%"
                    auto_setup: true
                    delete_after_ack: true
                    redeliver_timeout: 3600
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
                    jitter: 0.1

            async_priority_high:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                options:
                    stream: messages_high
                    group: symfony
                    consumer: "%env(MESSENGER_CONSUMER_ID)%"
                    auto_setup: true
                    delete_after_ack: true
                    redeliver_timeout: 3600
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
                    jitter: 0.1

            failed: "doctrine://default?queue_name=failed"

        routing:
            # Route your messages to the transports
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async_priority_high
            'App\Message\SendVerificationEmail': async_priority_high

when@dev:
    framework:
        messenger:
            transports:
                async: "sync://"
                async_priority_high: "sync://"

when@test:
    framework:
        messenger:
            transports:
                async: "in-memory://"
                async_priority_high: "in-memory://"
