# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(APP_VERSION): 'dev'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\EventSubscriber\RateLimitSubscriber:
        arguments:
            $registerLimiter: '@limiter.register'
            $apiLimiter: '@limiter.api'

    app.mercure.subscriber_jwt_factory:
        class: Symfony\Component\Mercure\Jwt\LcobucciFactory
        arguments:
            - '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'

    App\Controller\Api\Notification\MercureTokenController:
        arguments:
            $subscriberJwtFactory: '@app.mercure.subscriber_jwt_factory'

    App\Logging\RequestContextProcessor:
        tags:
            - { name: monolog.processor }

    app.redis_connection:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'
            - { lazy: true }

when@test:
    services:
        app.tests.null_mercure_publisher:
            class: App\Tests\Support\NullMercurePublisher

        app.tests.mercure_token_provider:
            class: Symfony\Component\Mercure\Jwt\StaticTokenProvider
            arguments:
                - 'test-mercure-token'

        mercure.hub.default:
            class: Symfony\Component\Mercure\MockHub
            arguments:
                $url: '%env(default::MERCURE_URL)%'
                $jwtProvider: '@app.tests.mercure_token_provider'
                $publisher: '@app.tests.null_mercure_publisher'
                $publicUrl: '%env(default::MERCURE_PUBLIC_URL)%'
